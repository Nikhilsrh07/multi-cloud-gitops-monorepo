apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nikhilsrh07-multi-cloud-app
  namespace: argocd
spec:
  project: portfolio
  source:
    repoURL: 'https://github.com/Nikhilsrh07/multi-cloud-gitops-monorepo.git'
    targetRevision: main
    path: helm/my-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
