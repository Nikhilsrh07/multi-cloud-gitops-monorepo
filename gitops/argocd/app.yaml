apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nikhilsrh07-multi-cloud-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com'
    targetRevision: HEAD
    path: helm/my-app
  destination:
    server: 'https://default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
