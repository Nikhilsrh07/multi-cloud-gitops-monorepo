apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portfolio
  namespace: production
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm/my-app
      sourceRef:
        kind: GitRepository
        name: portfolio
        namespace: flux-system
      interval: 1m
  values:
    image:
      repository: ghcr.io/nikhilsrh07/portfolio-website
      tag: latest
      pullPolicy: Always
