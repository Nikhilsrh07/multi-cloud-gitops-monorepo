replicaCount: 2

image:
  repository: ghcr.io/nikhilsrh07/portfolio-website
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: www.nikhilsrh07.com

externalDns:
  enabled: true

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  interval: 15s