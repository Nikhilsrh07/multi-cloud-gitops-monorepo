apiVersion: v1
kind: Service
metadata:
  name: nodejs-app-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: nodejs-multi-cloud-app
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.host | quote }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: nodejs-multi-cloud-app
