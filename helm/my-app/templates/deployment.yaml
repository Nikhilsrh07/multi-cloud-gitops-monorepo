apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels: app: my-app
spec:
  replicas: 2
  selector:
    matchLabels: app: my-app
  template:
    metadata:
      labels: app: my-app
    spec:
      containers:
        - name: web-app
          image: "nikhilsrh07acr.azurecr.io/my-app:latest"
          ports:
            - containerPort: 8080
